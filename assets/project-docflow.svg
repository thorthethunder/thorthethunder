  <linearGradient id="p3edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".7"/><stop offset=".4" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#6366f1" stop-opacity=".35"/></linearGradient>
  <filter id="p3blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
</defs>
<clipPath id="p3clip"><rect width="590" height="500" rx="24"/></clipPath>
