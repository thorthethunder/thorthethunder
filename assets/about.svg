<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="About Balakrishnan Lingan">
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Inter,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .in{animation:in .8s cubic-bezier(.2,.8,.2,1) both}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}
</style>
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121735"/><stop offset="1" stop-color="#0d1126"/></linearGradient>
  <linearGradient id="num" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
  <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
  <radialGradient id="glowA" cx=".1" cy="0" r="1"><stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/><stop offset=".6" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="1" cy="0" r="1"><stop offset="0" stop-color="#0ea5e9" stop-opacity=".3"/><stop offset=".6" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC" cx="1" cy="1" r="1"><stop offset="0" stop-color="#ec4899" stop-opacity=".22"/><stop offset=".6" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
</defs>
<g class="in "><rect x="0" y="0" width="600" height="360" rx="22" fill="url(#tile)"/><rect x="0" y="0" width="600" height="360" rx="22" fill="url(#glowA)"/><rect x="0.5" y="0.5" width="599" height="359" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
<rect x="32" y="32" width="168" height="28" rx="14" fill="#22c55e" fill-opacity=".12" stroke="#22c55e" stroke-opacity=".35"/>
<circle class="pulse" cx="50" cy="46" r="4.5" fill="#22c55e"/>
<text class="t" x="62" y="51" fill="#86efac" font-size="12.5" font-weight="700" letter-spacing=".8">OPEN TO CONNECT</text>
<text class="t" x="32" y="110" fill="#f8fafc" font-size="30" font-weight="800" letter-spacing="-.6">Hi, I'm Thor <tspan fill="url(#hl)">— I build</tspan></text>
<text class="t" x="32" y="146" fill="url(#hl)" font-size="30" font-weight="800" letter-spacing="-.6">products that ship.</text>
<text class="t" x="32" y="192" fill="#94a3b8" font-size="16">Lead Software Engineer with 7+ years building enterprise</text>
<text class="t" x="32" y="218" fill="#94a3b8" font-size="16">banking software on Java, Spring Boot, Angular and Oracle.</text>
<text class="t" x="32" y="252" fill="#94a3b8" font-size="16">Outside work, I build my own SaaS products and explore GenAI:</text>
<text class="t" x="32" y="278" fill="#94a3b8" font-size="16">multi-agent systems, Spring AI and local LLMs.</text>
</g>
<g class="in d1"><rect x="620" y="0" width="280" height="170" rx="22" fill="url(#tile)"/><rect x="620" y="0" width="280" height="170" rx="22" fill="url(#glowB)"/><rect x="620.5" y="0.5" width="279" height="169" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
<text class="t" x="648" y="96" fill="url(#num)" font-size="64" font-weight="800" letter-spacing="-2">7+</text>
<text class="t" x="648" y="128" fill="#e2e8f0" font-size="16" font-weight="700">years in FinTech</text>
<text class="t" x="648" y="150" fill="#64748b" font-size="13">Banking &amp; financial services</text></g>
<g class="in d2"><rect x="920" y="0" width="280" height="170" rx="22" fill="url(#tile)"/><rect x="920" y="0" width="280" height="170" rx="22" fill="url(#glowC)"/><rect x="920.5" y="0.5" width="279" height="169" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
<text class="m" x="948" y="44" fill="#f472b6" font-size="12" font-weight="700" letter-spacing="2">CURRENTLY</text>
<text class="t" x="948" y="86" fill="#f8fafc" font-size="22" font-weight="800">Lead Software</text>
<text class="t" x="948" y="114" fill="#f8fafc" font-size="22" font-weight="800">Engineer</text>
<text class="t" x="948" y="146" fill="#94a3b8" font-size="13.5">Quinte Financial Technologies</text></g>
<g class="in d3"><rect x="620" y="190" width="580" height="170" rx="22" fill="url(#tile)"/><rect x="620.5" y="190.5" width="579" height="169" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity=".09"/>
<text class="m" x="648" y="226" fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="2">AT WORK</text>
<rect x="648.0" y="238" width="48.6" height="28" rx="14.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".3"/><text class="t" x="672.3" y="256.7" fill="#fde68a" font-size="13" font-weight="600" text-anchor="middle">ACH</text><rect x="704.6" y="238" width="86.3" height="28" rx="14.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".3"/><text class="t" x="747.8" y="256.7" fill="#fde68a" font-size="13" font-weight="600" text-anchor="middle">Payments</text><rect x="798.9" y="238" width="86.3" height="28" rx="14.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".3"/><text class="t" x="842.1" y="256.7" fill="#fde68a" font-size="13" font-weight="600" text-anchor="middle">Disputes</text><rect x="893.3" y="238" width="56.2" height="28" rx="14.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".3"/><text class="t" x="921.3" y="256.7" fill="#fde68a" font-size="13" font-weight="600" text-anchor="middle">Java</text><rect x="957.4" y="238" width="78.8" height="28" rx="14.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".3"/><text class="t" x="996.8" y="256.7" fill="#fde68a" font-size="13" font-weight="600" text-anchor="middle">Angular</text><rect x="1044.2" y="238" width="71.2" height="28" rx="14.0" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".3"/><text class="t" x="1079.8" y="256.7" fill="#fde68a" font-size="13" font-weight="600" text-anchor="middle">Oracle</text>
<text class="m" x="648" y="300" fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="2">SIDE PROJECTS</text>
<rect x="648.0" y="312" width="131.6" height="28" rx="14.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".35"/><text class="t" x="713.8" y="330.7" fill="#ddd6fe" font-size="13" font-weight="600" text-anchor="middle">Multi-agent AI</text><rect x="787.6" y="312" width="93.9" height="28" rx="14.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".35"/><text class="t" x="834.5" y="330.7" fill="#ddd6fe" font-size="13" font-weight="600" text-anchor="middle">Spring AI</text><rect x="889.4" y="312" width="48.6" height="28" rx="14.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".35"/><text class="t" x="913.7" y="330.7" fill="#ddd6fe" font-size="13" font-weight="600" text-anchor="middle">RAG</text><rect x="946.0" y="312" width="48.6" height="28" rx="14.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".35"/><text class="t" x="970.3" y="330.7" fill="#ddd6fe" font-size="13" font-weight="600" text-anchor="middle">MCP</text><rect x="1002.7" y="312" width="71.2" height="28" rx="14.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".35"/><text class="t" x="1038.3" y="330.7" fill="#ddd6fe" font-size="13" font-weight="600" text-anchor="middle">Ollama</text><rect x="1081.9" y="312" width="56.2" height="28" rx="14.0" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".35"/><text class="t" x="1110.0" y="330.7" fill="#ddd6fe" font-size="13" font-weight="600" text-anchor="middle">SaaS</text>
<path d="M1060 213a5.5 5.5 0 0 1 5.5 5.5c0 4.1-5.5 9.5-5.5 9.5s-5.5-5.4-5.5-9.5a5.5 5.5 0 0 1 5.5-5.5z" fill="#64748b"/><circle cx="1060" cy="218.5" r="2" fill="#0d1126"/><text class="t" x="1172" y="226" fill="#94a3b8" font-size="13" text-anchor="end">Chennai, India</text></g>
</svg>