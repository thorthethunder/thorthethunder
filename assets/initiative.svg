<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Autonomous AI Software Engineering Platform">
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Inter,Helvetica,Arial,sans-serif} .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .in{animation:in .8s cubic-bezier(.2,.8,.2,1) both}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .flow{stroke-dasharray:6 8;animation:dash 1.2s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-14}}
  .pkt{animation:travel 7s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes travel{0%{transform:translateX(0);opacity:0}5%{opacity:1}95%{opacity:1}100%{transform:translateX(972px);opacity:0}}
  .node{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
  .hot{animation:hot 7s linear infinite}
  @keyframes hot{0%,100%{opacity:.15}50%{opacity:.5}}
</style>
<defs>
  <linearGradient id="inbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#14112e"/></linearGradient>
  <linearGradient id="inac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="inedge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f472b6" stop-opacity=".7"/><stop offset=".4" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".35"/></linearGradient>
  <filter id="inblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
</defs>
<clipPath id="inclip"><rect width="1200" height="560" rx="24"/></clipPath>
<g clip-path="url(#inclip)">
  <rect width="1200" height="560" fill="url(#inbg)"/>
  <circle cx="180.0" cy="0.0" r="160" fill="#f472b6" opacity=".28" filter="url(#inblur)"/>
  <circle cx="1020.0" cy="560.0" r="140" fill="#a78bfa" opacity=".16" filter="url(#inblur)"/>
</g>
<rect x=".75" y=".75" width="1198.5" height="558.5" rx="23.5" fill="none" stroke="url(#inedge)" stroke-width="1.5"/>
<defs><linearGradient id="inline" x1="0" x2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient></defs>
<g class="in">
<rect x="40" y="38" width="128" height="28" rx="14" fill="#f472b6" fill-opacity=".12" stroke="#f472b6" stroke-opacity=".4"/>
