<text class="m" x="70" y="56.5" fill="#f472b6" font-size="12" font-weight="700" letter-spacing="1.5">IN DESIGN</text>
<text class="t" x="40" y="112" fill="#f8fafc" font-size="32" font-weight="800" letter-spacing="-.8">Autonomous AI Software Engineering Platform</text>
<text class="t" x="40" y="144" fill="#94a3b8" font-size="17">A multi-agent system of specialised AI engineers that takes work from requirement to deployment.</text>
</g>
