<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90" role="img" aria-label="Thanks for visiting">
<style>
  .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .bar{animation:slide 6s linear infinite}
  @keyframes slide{from{transform:translateX(-1200px)}to{transform:translateX(1200px)}}
</style>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="1200" height="90"/></clipPath>
</defs>
<rect x="0" y="20" width="1200" height="1" fill="#7c3aed" opacity=".35"/>
<g clip-path="url(#c)"><rect class="bar" x="0" y="19" width="400" height="3" fill="url(#g)"/></g>
<text class="t" x="600" y="64" text-anchor="middle" fill="#94a3b8" font-size="16">Make it work · make it right · make it smart ⚡</text>
</svg>
